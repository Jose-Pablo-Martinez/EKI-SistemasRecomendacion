name: Database Migrations (Production)

on:
  push:
    branches:
      - main
    paths:
      - 'backend/models.py'
      - 'backend/migrations/**'
  workflow_dispatch:

jobs:
  migrate:
    name: Apply Migrations to Aiven Prod
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install -r backend/requirements.txt

      - name: Ejecutar Migraciones en Producción
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME_PROD }}
          DB_PORT: ${{ secrets.DB_PORT }}
          # El certificado puede ser pasado como secreto o descargado si es público
          # Por simplicidad, asumimos que ca.pem está en el repo o se descarga aquí
        run: |
          mkdir -p secrets
          # Opcional: descargar ca.pem si no está en el repo
          # curl -o secrets/ca.pem https://link-al-certificado.aiven.io
          
          # Ejecutar migración usando el wrapper
          python scripts/db/migrate.py
