<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Esquina Jach Ki'</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Science+Gothic:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  
  <link rel="icon" type="image/svg+xml" href="assets/isotipoEki.svg" />
  
  <!-- Carga del motor Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <!-- Configuración de diseño inyectada sobre el motor -->
  <script src="tailwind.config.js"></script>
  <!-- Leaflet para Mapas -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- Estilos base de tailwind para el proyecto -->
  <link rel="stylesheet" href="css/global.css" />
</head>

<body class="bg-surface font-sans text-text-primary min-h-screen flex flex-col antialiased selection:bg-accent selection:text-white">
  <!-- FASE 5: Skip link — primer elemento del body, visible solo en foco por teclado -->
  <a href="#app-root"
     class="eki-skip-link"
     tabindex="1">
    Ir al contenido principal
  </a>
  <!-- Header persistente (se actualiza según auth state) -->
  <header id="app-header" class="border-b border-border-default bg-surface-raised sticky top-0 z-40">
    <div id="header-container" class="w-full max-w-8xl mx-auto px-4 md:px-8 2xl:px-16 min-h-[4rem] py-3 flex items-center justify-between flex-wrap gap-4">
      <!-- Logo -->
      <a id="logo-link" href="#/" class="flex items-center gap-3 group py-2">
        <img src="assets/isotipoEki.svg" alt="EkiSystem Logo" class="h-12 w-auto transition-transform group-hover:scale-105" />
        <span class="font-heading font-bold text-xl tracking-tight text-primary">Esquina Jach Ki'</span>
      </a>

      <!-- Navegación -->
      <nav id="nav-menu" class="flex gap-4 md:gap-6 order-last md:order-none w-full md:w-auto justify-center md:justify-start pt-2 md:pt-0 border-t border-border-default md:border-t-0" aria-label="Navegación principal">
        <!-- Renderizado dinámicamente -->
      </nav>

      <!-- User Actions -->
      <div id="user-actions" class="flex items-center gap-4">
        <!-- Renderizado dinámicamente -->
      </div>
    </div>
  </header>

  <!-- Contenedor principal donde el router inyecta cada página -->
  <!-- tabindex="-1" permite que el skip link enfoque aquí programáticamente -->
  <main id="app-root" class="flex-1 flex flex-col" tabindex="-1">
    <div id="loading-screen" class="flex-1 flex flex-col items-center justify-center p-8 text-center text-accent gap-4">
      <span class="material-symbols-outlined text-5xl animate-spin" aria-hidden="true">progress_activity</span>
      <p class="font-medium text-text-tertiary animate-pulse tracking-wide" role="status">Cargando aplicación...</p>
    </div>
  </main>

  <!-- Footer persistente -->
  <footer id="app-footer" class="border-t border-border-default bg-surface-overlay py-5 mt-auto">
    <div id="footer-container" class="w-full max-w-8xl mx-auto px-4 md:px-8 2xl:px-16 text-center">
      <img src="assets/imagotipoEki.svg" alt="Logo de Esquina Jach Ki'" class="h-12 md:h-20 mx-auto mb-3 opacity-60 grayscale hover:grayscale-0 transition-all duration-300" />
      <p class="text-sm text-text-tertiary">Esquina Jach Ki' — ¡El descubrimiento a la vuelta de la esquina!</p>
    </div>
  </footer>

  <!--
    Toast container
    aria-live="polite"  → el lector de pantalla anuncia nuevos toasts sin interrumpir
    aria-atomic="false" → cada toast se anuncia por separado
  -->
  <div id="toast-container"
       class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"
       role="region"
       aria-label="Notificaciones"
       aria-live="polite"
       aria-atomic="false">
  </div>

  <!-- Aplicación (ES Modules Entry Point) siguiendo el estandar de javascript -->
  <script type="module" src="scripts/app.js"></script>
</body>
</html>
