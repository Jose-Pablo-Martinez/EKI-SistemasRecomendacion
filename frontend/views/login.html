<div class="flex-1 flex flex-col items-center justify-center p-4 md:p-8 w-full max-w-md xl:max-w-2xl 2xl:max-w-4xl mx-auto">
    <h1 class="font-heading text-headline-lg xl:text-5xl 2xl:text-6xl text-primary mb-6 xl:mb-10 text-center transition-all">Iniciar Sesión</h1>
    <div class="w-full bg-surface-raised p-5 md:p-8 xl:p-10 2xl:p-12 rounded-md shadow-sm border border-border-default text-left transition-all">
        <form id="login-form" class="flex flex-col gap-4 xl:gap-6" novalidate>
            <div id="login-form-error" class="text-accent text-sm xl:text-base hidden font-bold bg-accent-faint p-3 rounded"></div>
            <div>
                <label class="block text-text-secondary text-sm font-bold mb-2 uppercase tracking-wide">Email</label>
                <input type="email" id="email" required class="w-full p-2 xl:p-3 2xl:p-4 border border-border-default rounded bg-surface-sunken focus:outline-none focus:border-border-focus text-base xl:text-lg" />
                <p id="email-error" class="text-accent text-xs font-bold mt-1 hidden"></p>
            </div>
            <div>
                <label class="block text-text-secondary text-sm font-bold mb-2 uppercase tracking-wide">Contraseña</label>
                <div class="relative">
                    <input type="password" id="password" required class="w-full p-2 xl:p-3 2xl:p-4 border border-border-default rounded bg-surface-sunken focus:outline-none focus:border-border-focus text-base xl:text-lg pr-12" />
                    <button type="button" id="toggle-password" class="absolute inset-y-0 right-0 px-3 flex items-center text-text-tertiary hover:text-primary transition-colors focus:outline-none" title="Mostrar contraseña">
                        <span class="material-symbols-outlined text-xl" id="icon-password">visibility_off</span>
                    </button>
                </div>
                <p id="password-error" class="text-accent text-xs font-bold mt-1 hidden"></p>
            </div>
            <button type="submit" class="bg-accent text-white font-bold py-3 xl:py-4 px-4 rounded hover:bg-accent-hover active:scale-95 transition-all w-full mt-4 xl:mt-8 uppercase tracking-widest text-sm xl:text-base">Ingresar</button>
            <div class="mt-4 xl:mt-6 text-center text-sm xl:text-base text-text-secondary">
                ¿No tienes cuenta? <a href="#/registro" class="text-secondary font-bold hover:underline">Regístrate</a>
            </div>
        </form>
    </div>
</div>
