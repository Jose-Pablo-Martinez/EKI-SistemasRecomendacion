<div id="perfil-skeleton" class="w-full max-w-4xl mx-auto px-4 md:px-8 py-10">
  <div class="flex items-center gap-5 mb-10">
    <div class="skeleton w-20 h-20 rounded-full flex-shrink-0"></div>
    <div class="space-y-2"><div class="skeleton h-8 w-48 rounded"></div><div class="skeleton h-4 w-32 rounded"></div></div>
  </div>
  <div class="skeleton h-40 rounded-md mb-6"></div>
  <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
    <div class="skeleton h-24 rounded-md"></div><div class="skeleton h-24 rounded-md"></div><div class="skeleton h-24 rounded-md"></div><div class="skeleton h-24 rounded-md"></div>
  </div>
  <div class="skeleton h-64 rounded-md"></div>
</div>

<div id="perfil-error" class="hidden flex-col items-center justify-center py-32 text-center px-4">
  <span class="material-symbols-outlined text-5xl text-text-tertiary mb-4">person_off</span>
  <h2 class="font-heading text-headline-lg text-primary mb-2">No se pudo cargar el perfil</h2>
  <button onclick="window.controllers.perfil()"
    class="bg-accent text-white px-5 py-2 rounded font-semibold hover:bg-accent-hover transition-colors mt-4">
    Reintentar
  </button>
</div>

<div id="perfil-content" class="hidden w-full max-w-4xl mx-auto px-4 md:px-8 py-10 fade-in">
  <!-- Header -->
  <div class="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-5 mb-10">
    <div class="flex items-center gap-5">
      <div id="perfil-avatar" class="w-20 h-20 rounded-full bg-primary flex items-center justify-center font-heading text-2xl font-bold text-white flex-shrink-0 select-none"></div>
      <div>
        <h1 id="perfil-nombre-completo" class="font-heading text-display-md text-primary leading-tight"></h1>
        <p id="perfil-email" class="text-body-sm text-text-secondary mt-0.5"></p>
        <span id="perfil-tipo-label" class="inline-block mt-1.5 text-label-sm px-2 py-0.5 rounded bg-surface-dim text-text-tertiary border border-border-default"></span>
      </div>
    </div>
    <div class="flex flex-wrap gap-2 sm:flex-nowrap sm:flex-col sm:items-end">
      <button id="btn-editar-perfil" aria-label="Editar perfil" class="flex items-center gap-1.5 px-3 py-2 rounded border border-border-default text-body-sm text-text-secondary hover:border-border-strong hover:text-primary transition-all">
        <span class="material-symbols-outlined" style="font-size:16px;">edit</span> Editar perfil
      </button>
      <a href="#/onboarding" class="flex items-center gap-1.5 px-3 py-2 rounded border border-border-default text-body-sm text-text-secondary hover:border-secondary hover:text-secondary transition-all">
        <span class="material-symbols-outlined" style="font-size:16px;">tune</span> Mis preferencias
      </a>
      <button id="btn-agregar-lugar" onclick="_abrirAgregarLugar()" class="hidden items-center gap-1.5 px-3 py-2 rounded border border-accent-muted text-body-sm text-accent hover:bg-accent-faint transition-all">
        <span class="material-symbols-outlined" style="font-size:16px;">add_location_alt</span> Agregar lugar
      </button>
    </div>
  </div>

  <!-- Tarjeta de rango -->
  <div class="bg-surface-raised border border-border-default rounded-md p-6 mb-6">
    <div class="flex items-start justify-between gap-4 mb-5">
      <div>
        <p class="text-label-md text-text-tertiary uppercase tracking-wide mb-2">Tu rango actual</p>
        <div class="flex items-center gap-3">
          <span id="rango-icon" class="material-symbols-outlined" style="font-size:32px;"></span>
          <span id="rango-nombre" class="font-heading text-headline-lg text-primary"></span>
        </div>
      </div>
      <div class="text-right">
        <p class="text-label-md text-text-tertiary mb-1">Puntos totales</p>
        <p id="pts-odometro" class="font-heading text-numeric-lg tabular-nums">0</p>
      </div>
    </div>
    <div id="rango-progreso-container"></div>
  </div>

  <!-- Estadísticas -->
  <div id="stats-container" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8"></div>

  <!-- Historial de puntos -->
  <div class="bg-surface-raised border border-border-default rounded-md p-6">
    <h2 class="font-heading text-headline-md text-primary mb-4">Historial de puntos</h2>
    <div id="historial-container"></div>
  </div>
</div>

<!-- Modal Editar -->
<div id="modal-edicion" class="hidden fixed inset-0 z-50 items-center justify-center p-4" style="background:rgba(30,27,24,0.5);" onclick="if(event.target===this)_cerrarModal('modal-edicion')" role="dialog" aria-modal="true" aria-labelledby="modal-edicion-titulo">
  <div class="bg-surface-raised border border-border-default rounded-md p-6 w-full max-w-md shadow-xl">
    <div class="flex items-center justify-between mb-5">
      <h3 id="modal-edicion-titulo" class="font-heading text-headline-sm text-primary">Editar perfil</h3>
      <button onclick="_cerrarModal('modal-edicion')" aria-label="Cerrar modal" class="text-text-tertiary hover:text-primary transition-colors">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
    <div class="space-y-4">
      <div>
        <label for="edit-nombre" class="block text-label-md text-text-secondary uppercase tracking-wide mb-1">Nombre *</label>
        <input id="edit-nombre" type="text" autocomplete="given-name" class="w-full bg-surface-dim border border-border-default rounded p-2.5 text-body-sm text-text-primary focus:outline-none focus:border-border-focus focus:ring-2 focus:ring-[var(--border-focus)]/20 transition-colors" />
      </div>
      <div>
        <label for="edit-apellido" class="block text-label-md text-text-secondary uppercase tracking-wide mb-1">Apellido</label>
        <input id="edit-apellido" type="text" autocomplete="family-name" class="w-full bg-surface-dim border border-border-default rounded p-2.5 text-body-sm text-text-primary focus:outline-none focus:border-border-focus focus:ring-2 focus:ring-[var(--border-focus)]/20 transition-colors" />
      </div>
    </div>
    <div class="flex gap-3 mt-6 justify-end">
      <button onclick="_cerrarModal('modal-edicion')" class="px-4 py-2 rounded border border-border-default text-body-sm text-text-secondary hover:border-border-strong transition-colors">Cancelar</button>
      <button id="btn-guardar-perfil" onclick="_guardarPerfil()" class="flex items-center gap-2 px-5 py-2 rounded bg-accent text-white font-semibold text-label-lg hover:bg-accent-hover active:scale-95 transition-all disabled:opacity-50 disabled:cursor-not-allowed">Guardar cambios</button>
    </div>
  </div>
</div>

<!-- Modal Agregar Lugar -->
<div id="modal-lugar" class="hidden fixed inset-0 z-50 items-center justify-center p-4" style="background:rgba(30,27,24,0.5);" onclick="if(event.target===this)_cerrarAgregarLugar()" role="dialog" aria-modal="true" aria-labelledby="modal-lugar-titulo">
  <div class="bg-surface-raised border border-border-default rounded-md p-6 w-full max-w-lg shadow-xl max-h-[90vh] overflow-y-auto">
    <div class="flex items-center justify-between mb-5">
      <h3 id="modal-lugar-titulo" class="font-heading text-headline-sm text-primary">Agregar un lugar</h3>
      <button onclick="_cerrarAgregarLugar()" aria-label="Cerrar modal" class="text-text-tertiary hover:text-primary transition-colors">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
    <p class="text-body-sm text-text-secondary mb-5 leading-relaxed">Tu propuesta será revisada por el equipo antes de publicarse. Una vez aprobada ganará puntos y aparecerá en el feed.</p>
    <div class="space-y-4">
      <div>
        <label for="lugar-nombre" class="block text-label-md text-text-secondary uppercase tracking-wide mb-1">Nombre del lugar *</label>
        <input id="lugar-nombre" type="text" placeholder="Ej: Tacos El Caminante" class="w-full bg-surface-dim border border-border-default rounded p-2.5 text-body-sm text-text-primary placeholder:text-text-tertiary focus:outline-none focus:border-border-focus focus:ring-2 focus:ring-[var(--border-focus)]/20 transition-colors" />
      </div>
      <div>
        <label for="lugar-tipo" class="block text-label-md text-text-secondary uppercase tracking-wide mb-1">Tipo *</label>
        <select id="lugar-tipo" class="w-full bg-surface-dim border border-border-default rounded p-2.5 text-body-sm text-text-primary focus:outline-none focus:border-border-focus focus:ring-2 focus:ring-[var(--border-focus)]/20 transition-colors">
          <option value="">Selecciona el tipo...</option>
          <option value="puesto_informal">Puesto informal</option>
          <option value="restaurante">Restaurante</option>
          <option value="local_comercial">Local comercial</option>
        </select>
      </div>
      <div>
        <label for="lugar-desc" class="block text-label-md text-text-secondary uppercase tracking-wide mb-1">Descripción</label>
        <textarea id="lugar-desc" placeholder="¿Qué lo hace especial?" rows="3" class="w-full bg-surface-dim border border-border-default rounded p-2.5 text-body-sm text-text-primary placeholder:text-text-tertiary resize-none focus:outline-none focus:border-border-focus focus:ring-2 focus:ring-[var(--border-focus)]/20 transition-colors"></textarea>
      </div>
      <div>
        <label for="lugar-dir" class="block text-label-md text-text-secondary uppercase tracking-wide mb-1">Dirección</label>
        <input id="lugar-dir" type="text" placeholder="Calle, colonia, referencias..." class="w-full bg-surface-dim border border-border-default rounded p-2.5 text-body-sm text-text-primary placeholder:text-text-tertiary focus:outline-none focus:border-border-focus focus:ring-2 focus:ring-[var(--border-focus)]/20 transition-colors" />
      </div>
      <label class="flex items-center gap-3 cursor-pointer select-none">
        <input id="lugar-informal" type="checkbox" class="w-4 h-4 rounded border-border-default accent-accent" />
        <span class="text-body-sm text-text-secondary">Es un puesto o negocio informal</span>
      </label>
    </div>
    <div class="flex gap-3 mt-6 justify-end">
      <button onclick="_cerrarAgregarLugar()" class="px-4 py-2 rounded border border-border-default text-body-sm text-text-secondary hover:border-border-strong transition-colors">Cancelar</button>
      <button id="btn-enviar-lugar" onclick="_enviarLugar()" class="flex items-center gap-2 px-5 py-2 rounded bg-accent text-white font-semibold text-label-lg hover:bg-accent-hover active:scale-95 transition-all disabled:opacity-50 disabled:cursor-not-allowed">Enviar para revisión</button>
    </div>
  </div>
</div>

<style>
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
