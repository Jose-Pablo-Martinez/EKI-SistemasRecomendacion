<div class="flex-1 flex flex-col items-center justify-center p-8 w-full max-w-md xl:max-w-xl 2xl:max-w-2xl mx-auto">
    <h1 class="font-heading text-headline-lg xl:text-5xl 2xl:text-6xl text-primary mb-6 xl:mb-10 text-center transition-all">Registro</h1>
    <div class="w-full bg-surface-raised p-6 xl:p-10 2xl:p-12 rounded-md shadow-sm border border-border-default text-left transition-all">
        <form id="register-form" class="flex flex-col gap-4 xl:gap-6" novalidate>
            <div id="register-form-error" class="text-accent text-sm xl:text-base hidden font-bold bg-accent-faint p-3 rounded"></div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 xl:gap-6">
                <div>
                    <label class="block text-text-secondary text-sm font-bold mb-2 uppercase tracking-wide">Nombre</label>
                    <input type="text" id="nombre" required class="w-full p-2 xl:p-3 2xl:p-4 border border-border-default rounded bg-surface-sunken focus:outline-none focus:border-border-focus text-base xl:text-lg" />
                </div>
                <div>
                    <label class="block text-text-secondary text-sm font-bold mb-2 uppercase tracking-wide">Apellido</label>
                    <input type="text" id="apellido" required class="w-full p-2 xl:p-3 2xl:p-4 border border-border-default rounded bg-surface-sunken focus:outline-none focus:border-border-focus text-base xl:text-lg" />
                </div>
            </div>
            <div>
                <label class="block text-text-secondary text-sm font-bold mb-2 uppercase tracking-wide">Email</label>
                <input type="email" id="email" required class="w-full p-2 xl:p-3 2xl:p-4 border border-border-default rounded bg-surface-sunken focus:outline-none focus:border-border-focus text-base xl:text-lg" />
            </div>
            <div>
                <label class="block text-text-secondary text-sm font-bold mb-2 uppercase tracking-wide">Contraseña</label>
                <input type="password" id="password" required minlength="8" class="w-full p-2 xl:p-3 2xl:p-4 border border-border-default rounded bg-surface-sunken focus:outline-none focus:border-border-focus text-base xl:text-lg" />
            </div>
            <div>
                <label class="block text-text-secondary text-sm font-bold mb-2 uppercase tracking-wide">Confirmar Contraseña</label>
                <input type="password" id="password_confirm" required minlength="8" class="w-full p-2 xl:p-3 2xl:p-4 border border-border-default rounded bg-surface-sunken focus:outline-none focus:border-border-focus text-base xl:text-lg" />
            </div>
            <button type="submit" class="bg-accent text-white font-bold py-3 xl:py-4 px-4 rounded hover:bg-accent-hover active:scale-95 transition-all w-full mt-4 xl:mt-8 uppercase tracking-widest text-sm xl:text-base">Crear cuenta</button>
            <div class="mt-4 xl:mt-6 text-center text-sm xl:text-base text-text-secondary">
                ¿Ya tienes cuenta? <a href="#/login" class="text-secondary font-bold hover:underline">Inicia sesión</a>
            </div>
        </form>
    </div>
</div>
