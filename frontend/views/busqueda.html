<div class="w-full max-w-8xl mx-auto px-4 md:px-8 2xl:px-16 py-10 fade-in">

  <!-- Header de la página -->
  <div class="mb-8">
    <h1 class="font-heading text-display-md text-primary mb-1">Explorar</h1>
    <p class="text-body-lg text-text-secondary">Encuentra lugares por nombre, tipo o zona.</p>
  </div>

  <!-- Barra de búsqueda -->
  <div class="relative max-w-2xl mb-6">
    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-text-tertiary">
      <span class="material-symbols-outlined" style="font-size:20px;">search</span>
    </span>
    <input
      type="text"
      id="busq-input"
      placeholder="¿Qué se te antoja hoy?"
      autocomplete="off"
      class="w-full bg-surface-raised border border-border-default rounded-md pl-11 pr-4 py-3.5
             text-body-md text-text-primary placeholder:text-text-tertiary
             focus:outline-none focus:border-border-focus focus:ring-2 focus:ring-border-focus/20
             shadow-sm transition-all"
    />
    <button id="busq-clear" onclick="_clearBusqueda()"
      class="absolute right-3 top-1/2 -translate-y-1/2 text-text-tertiary hover:text-primary transition-colors hidden">
      <span class="material-symbols-outlined" style="font-size:18px;">close</span>
    </button>
    
    <!-- Autocomplete Dropdown -->
    <div id="autocomplete-menu" class="absolute left-0 right-0 top-[calc(100%+4px)] bg-white border border-border-default rounded-md shadow-lg z-50 hidden overflow-hidden fade-in">
      <ul id="autocomplete-list" class="flex flex-col m-0 p-0 list-none">
        <!-- Generado dinámicamente -->
      </ul>
    </div>
  </div>

  <!-- Chips de filtro -->
  <div class="flex gap-2 flex-wrap mb-8" id="chips-container">
  </div>

  <!-- Banner para usuarios no registrados -->
  <div id="guest-banner" class="hidden relative mb-6 bg-gradient-to-r from-accent/10 to-primary/10 border border-accent/20 rounded-lg p-5 pr-12 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 fade-in shadow-sm">
    <button onclick="document.getElementById('guest-banner').classList.add('hidden')" 
            class="absolute top-2 right-2 w-8 h-8 flex items-center justify-center text-text-tertiary hover:text-primary transition-colors rounded-full hover:bg-white/60 focus:outline-none focus:ring-2 focus:ring-accent/50" 
            aria-label="Cerrar banner" title="Cerrar">
      <span class="material-symbols-outlined" style="font-size:20px;">close</span>
    </button>
    
    <div class="flex-1">
      <h3 class="font-heading text-headline-sm text-primary mb-1">¿Quieres recomendaciones personalizadas?</h3>
      <p class="text-body-sm text-text-secondary leading-relaxed">Inicia sesión para guardar favoritos, descubrir tu porcentaje de Match y ganar recompensas.</p>
    </div>
    
    <div class="flex-shrink-0 w-full sm:w-auto mt-2 sm:mt-0">
      <a href="#/registro" class="block text-center sm:inline-block bg-accent text-white px-6 py-2.5 rounded-md font-semibold text-label-md hover:bg-accent-hover transition-colors shadow-sm">
        Crear cuenta gratis
      </a>
    </div>
  </div>

  <!-- Resultados -->
  <div id="busq-resultados" role="list" class="grid grid-cols-1 md:grid-cols-2 gap-3">
    <div class="flex flex-col items-center justify-center py-16 text-center col-span-full">
      <span class="material-symbols-outlined text-5xl text-text-tertiary mb-4">restaurant_menu</span>
      <p class="font-heading text-headline-md text-primary mb-2">¿Qué se te antoja hoy?</p>
      <p class="text-body-md text-text-secondary">Escribe al menos 2 letras para buscar.</p>
    </div>
  </div>
</div>
