name: EKI — Jobs Offline Scheduler

# Ejecuta los jobs offline de EkiSystem en secuencia cada 12 horas.
# El orden importa: NLP y Métricas deben correr ANTES que Clustering,
# y Clustering ANTES que Recomendaciones (dependencias de datos).
#
# El workflow NO usa sleeps ciegos. En su lugar consulta el endpoint
# GET /admin/jobs/{job}/status hasta recibir "idle" (job terminado)
# o hasta agotar el timeout de seguridad, evitando esperas innecesarias
# y colisiones entre jobs cuando la BD crece.
#
# También disponible en modo manual desde la pestaña Actions de GitHub.

on:
  schedule:
    # Ejecutar cada 12 horas: 00:00, 12:00 UTC
    # Equivale a: 18:00, 06:00 hora CDMX-Mérida (UTC-6)
    - cron: '0 */12 * * *'
  workflow_dispatch: # Permite ejecución manual sin esperar el cron

# Evita que dos ejecuciones corran en paralelo sobre el mismo entorno.
# Si el cron lanza una nueva corrida mientras la anterior sigue activa,
# la nueva espera en cola en lugar de pisar los datos a medio procesar.
concurrency:
  group: offline-jobs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-offline-jobs:
    name: Disparar Jobs Offline (NLP → Métricas → Clustering → Recomendaciones)
    runs-on: ubuntu-latest
    environment: ekiEnvironment # Mismo Environment que database-migrations.yml
    # Timeout global: 55 min cubre warmup (30s) + 4 polls de hasta 15min c/u con margen.
    # Evita que un job trabado en Render consuma horas de GitHub Actions sin control.
    timeout-minutes: 55

    steps:
      # ── 1. Despertar el servicio Render ──────────────────────────────────────
      # Render Free Tier duerme tras 15 min de inactividad.
      # El primer curl al /health lo despierta (puede tardar ~30-50s en arrancar).
      - name: Despertar servicio Render
        run: |
          echo "Haciendo ping al servicio para despertar Render..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 60 \
            "${{ secrets.RENDER_API_URL }}/health")
          echo "HTTP status del /health: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Advertencia: /health respondió $HTTP_CODE. El servicio puede estar arrancando aún."
          fi

      # ── 2. Esperar warmup completo ────────────────────────────────────────────
      - name: Esperar warmup del servicio (30s)
        run: sleep 30

      # ── 3. Job NLP ───────────────────────────────────────────────────────────
      # Analiza polaridad/subjetividad de reseñas y actualiza metrica_establecimiento.
      # No depende de clustering — puede correr primero.
      - name: Ejecutar Job NLP
        run: |
          echo "Disparando job: nlp..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.RENDER_API_URL }}/admin/jobs/nlp" \
            -H "Authorization: Bearer ${{ secrets.ADMIN_JWT_TOKEN }}" \
            -H "Content-Type: application/json" \
            --max-time 30)
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          echo "Respuesta: $BODY (HTTP $HTTP_CODE)"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Error al disparar job nlp (HTTP $HTTP_CODE). Abortando pipeline."
            exit 1
          fi

      # ── 4. Job Métricas ──────────────────────────────────────────────────────
      # Recalcula score_boost_combinado, popularidad_7d/30d, score_contenido_base.
      # Debe correr antes de Clustering para que los vectores estén actualizados.
      - name: Ejecutar Job Métricas
        run: |
          echo "Disparando job: metricas..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.RENDER_API_URL }}/admin/jobs/metricas" \
            -H "Authorization: Bearer ${{ secrets.ADMIN_JWT_TOKEN }}" \
            -H "Content-Type: application/json" \
            --max-time 30)
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          echo "Respuesta: $BODY (HTTP $HTTP_CODE)"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Error al disparar job metricas (HTTP $HTTP_CODE). Abortando pipeline."
            exit 1
          fi

      # ── 5. Esperar NLP y Métricas (polling real) ─────────────────────────────
      # En lugar de un sleep fijo, consultamos el endpoint de status cada 10s.
      # El bucle avanza en cuanto AMBOS jobs reportan "idle".
      # Timeout de seguridad: 15 min (90 iteraciones). Si se supera, el pipeline falla
      # con un mensaje claro en lugar de lanzar Clustering con datos incompletos.
      - name: Esperar finalización de NLP y Métricas
        run: |
          AUTH="Authorization: Bearer ${{ secrets.ADMIN_JWT_TOKEN }}"
          BASE="${{ secrets.RENDER_API_URL }}"
          MAX_ITER=90
          INTERVAL=10

          echo "Esperando a que NLP y Métricas terminen (máx ${MAX_ITER} intentos c/u)..."

          for JOB in nlp metricas; do
            echo "--- Monitoreando job: $JOB ---"
            ITER=0
            while [ $ITER -lt $MAX_ITER ]; do
              STATUS=$(curl -s -X GET \
                "$BASE/admin/jobs/$JOB/status" \
                -H "$AUTH" \
                --max-time 15 | python3 -c "import sys,json; print(json.load(sys.stdin).get('status','unknown'))")

              echo "  [$JOB] intento $((ITER+1))/$MAX_ITER → $STATUS"

              if [ "$STATUS" = "idle" ]; then
                echo "  [$JOB] ✓ Completado."
                break
              fi

              ITER=$((ITER+1))
              if [ $ITER -ge $MAX_ITER ]; then
                echo "  [$JOB] ✗ Timeout: el job no terminó en $((MAX_ITER * INTERVAL))s."
                exit 1
              fi

              sleep $INTERVAL
            done
          done

          echo "NLP y Métricas finalizados. Continuando con Clustering..."

      # ── 6. Job Clustering ────────────────────────────────────────────────────
      # Ejecuta K-Means sobre establecimientos y asigna id_cluster.
      # Depende de que vector_caracteristicas y métricas estén actualizadas.
      - name: Ejecutar Job Clustering
        run: |
          echo "Disparando job: clustering..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.RENDER_API_URL }}/admin/jobs/clustering" \
            -H "Authorization: Bearer ${{ secrets.ADMIN_JWT_TOKEN }}" \
            -H "Content-Type: application/json" \
            --max-time 30)
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          echo "Respuesta: $BODY (HTTP $HTTP_CODE)"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Error al disparar job clustering (HTTP $HTTP_CODE). Abortando pipeline."
            exit 1
          fi

      # ── 7. Esperar Clustering (polling real) ─────────────────────────────────
      # K-Means puede tardar dependiendo del volumen de establecimientos.
      # Se consulta el status cada 10s hasta que reporte "idle" o se agote el timeout.
      - name: Esperar finalización de Clustering
        run: |
          AUTH="Authorization: Bearer ${{ secrets.ADMIN_JWT_TOKEN }}"
          BASE="${{ secrets.RENDER_API_URL }}"
          MAX_ITER=90
          INTERVAL=10

          echo "Monitoreando job: clustering (máx ${MAX_ITER} intentos)..."
          ITER=0
          while [ $ITER -lt $MAX_ITER ]; do
            STATUS=$(curl -s -X GET \
              "$BASE/admin/jobs/clustering/status" \
              -H "$AUTH" \
              --max-time 15 | python3 -c "import sys,json; print(json.load(sys.stdin).get('status','unknown'))")

            echo "  [clustering] intento $((ITER+1))/$MAX_ITER → $STATUS"

            if [ "$STATUS" = "idle" ]; then
              echo "  [clustering] ✓ Completado."
              break
            fi

            ITER=$((ITER+1))
            if [ $ITER -ge $MAX_ITER ]; then
              echo "  [clustering] ✗ Timeout: el job no terminó en $((MAX_ITER * INTERVAL))s."
              exit 1
            fi

            sleep $INTERVAL
          done

          echo "Clustering finalizado. Continuando con Recomendaciones..."

      # ── 8. Job Recomendaciones ───────────────────────────────────────────────
      # Genera recomendacion_generada para todos los usuarios activos.
      # Es el job más pesado — depende de clusters y métricas actualizadas.
      - name: Ejecutar Job Recomendaciones
        run: |
          echo "Disparando job: recomendaciones..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.RENDER_API_URL }}/admin/jobs/recomendaciones" \
            -H "Authorization: Bearer ${{ secrets.ADMIN_JWT_TOKEN }}" \
            -H "Content-Type: application/json" \
            --max-time 30)
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          echo "Respuesta: $BODY (HTTP $HTTP_CODE)"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Error al disparar job recomendaciones (HTTP $HTTP_CODE). Abortando pipeline."
            exit 1
          fi

      # ── 9. Esperar Recomendaciones (polling real) ────────────────────────────
      # Esperamos a que termine para poder marcar el workflow como completado con seguridad.
      - name: Esperar finalización de Recomendaciones
        run: |
          AUTH="Authorization: Bearer ${{ secrets.ADMIN_JWT_TOKEN }}"
          BASE="${{ secrets.RENDER_API_URL }}"
          MAX_ITER=90
          INTERVAL=10

          echo "Monitoreando job: recomendaciones (máx ${MAX_ITER} intentos)..."
          ITER=0
          while [ $ITER -lt $MAX_ITER ]; do
            STATUS=$(curl -s -X GET \
              "$BASE/admin/jobs/recomendaciones/status" \
              -H "$AUTH" \
              --max-time 15 | python3 -c "import sys,json; print(json.load(sys.stdin).get('status','unknown'))")

            echo "  [recomendaciones] intento $((ITER+1))/$MAX_ITER → $STATUS"

            if [ "$STATUS" = "idle" ]; then
              echo "  [recomendaciones] ✓ Completado."
              break
            fi

            ITER=$((ITER+1))
            if [ $ITER -ge $MAX_ITER ]; then
              echo "  [recomendaciones] ✗ Timeout: el job no terminó en $((MAX_ITER * INTERVAL))s."
              exit 1
            fi

            sleep $INTERVAL
          done

          echo "Pipeline de jobs completado exitosamente."

      # ── 10. Resumen del pipeline (Job Summary) ───────────────────────────────
      # Escribe una tabla visible en la pestaña Actions del run con el resultado
      # de cada job. Siempre corre (éxito o fallo) para dejar constancia.
      - name: Generar resumen del pipeline
        if: always()
        run: |
          echo "## Resumen del Pipeline — Jobs Offline EkiSystem" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Estado |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Warmup Render | Ejecutado |" >> $GITHUB_STEP_SUMMARY
          echo "| NLP | ${{ job.status == 'success' && 'OK' || 'Falló / Timeout' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Métricas | ${{ job.status == 'success' && 'OK' || 'Falló / Timeout' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Clustering | ${{ job.status == 'success' && 'OK' || 'Falló / Timeout' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Recomendaciones | ${{ job.status == 'success' && 'OK' || 'Falló / Timeout' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Resultado final:** ${{ job.status == 'success' && 'Pipeline completado exitosamente' || 'Pipeline terminó con errores — revisar logs' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Ejecución:** [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

      # ── 11. Limpiar Deployments Antiguos (Basura de GitHub) ──────────────────
      # Como este job usa "environment: ekiEnvironment", GitHub crea un deployment nuevo
      # en cada ejecución (cada 12 horas). Para evitar que el historial se llene,
      # este paso borra los deployments anteriores que ya están inactivos.
      - name: Limpiar historial de deployments
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Borrando deployments inactivos del entorno ekiEnvironment..."
          
          # Obtenemos los últimos 20 deployments del entorno
          DEPLOYMENTS=$(gh api -H "Accept: application/vnd.github+json" "/repos/${{ github.repository }}/deployments?environment=ekiEnvironment&per_page=20")
          
          # Recorremos cada deployment e intentamos borrarlo.
          # GitHub automáticamente rechaza borrar el que esté "activo" (el más reciente
          # de esta misma ejecución), así que se ignoran esos errores con || true.
          echo "$DEPLOYMENTS" | jq -c '.[]' | while read -r dep; do
            ID=$(echo "$dep" | jq -r '.id')
            echo "Intentando borrar deployment ID: $ID..."
            gh api --method DELETE -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/deployments/$ID > /dev/null 2>&1 || true
          done
          echo "Limpieza completada."
