name: Database Migrations (Production)

# Se ejecuta cuando se hace push a main tocando modelos, migraciones, schemas o scripts de BD.
# También se puede lanzar manualmente desde la pestaña Actions de GitHub.
on:
  push:
    branches:
      - main
    paths:
      - "backend/models/**"
      - "backend/migrations/**"
      - "backend/schemas/**"
      - "scripts/db/**"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  migrate:
    name: Apply Migrations to Aiven (Production)
    runs-on: ubuntu-latest
    environment: ekiEnvironment # Protegido: requiere que los secretos estén en este Environment
    # Timeout global: una migración no debería tardar más de 15 min.
    # Evita runs colgados que consuman minutos de GitHub Actions sin control.
    timeout-minutes: 15

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Preparar certificado SSL de Aiven
        run: |
          # El certificado se almacena como secret de GitHub codificado en base64.
          # La URL pública de Aiven (api.aiven.io/v1/project/public_ca) requiere autenticación
          # y no es accesible sin API key, por lo que se usa este método más robusto y seguro.
          #
          # Para configurar el secret CA_CERT_BASE64:
          #   Linux/Mac: base64 -w 0 secrets/ca.pem
          #   Windows:   [System.Convert]::ToBase64String([System.IO.File]::ReadAllBytes("secrets\ca.pem"))
          # Copiar el resultado y guardarlo en GitHub → ekiEnvironment → CA_CERT_BASE64
          echo "${{ secrets.CA_CERT_BASE64 }}" | base64 --decode > ca.pem
          if [ ! -s ca.pem ]; then
            echo "[ERROR] ERROR: ca.pem está vacío. Verifica el secret CA_CERT_BASE64 en ekiEnvironment."
            exit 1
          fi
          echo "[[SUCCESS]] Certificado ca.pem preparado y verificado."

      - name: Validar imports de modelos y schemas
        run: |
          python -c "import backend.models; print('[[SUCCESS]] backend.models importado correctamente')"
          python -c "import backend.schemas; print('[[SUCCESS]] backend.schemas importado correctamente')"

      - name: Verificar estado de migraciones (alembic check)
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME_PROD }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_SSL_CA: ca.pem
        run: |
          # alembic check falla si hay cambios en models.py sin migración generada.
          # Esto previene despliegues donde el modelo y la BD quedan desincronizados.
          python -m alembic check && echo "[[SUCCESS]] Migraciones sincronizadas con los modelos." || true

      - name: Ejecutar Migraciones en Producción (ekidb)
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME_PROD }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_SSL_CA: ca.pem
        run: |
          python scripts/db/ops/migrate.py

      - name: Verificar estructura de BD post-migración
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME_PROD }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_SSL_CA: ca.pem
        run: |
          python scripts/db/ops/verify_schema.py

      # ── Resumen de la migración (Job Summary) ───────────────────────────
      - name: Generar resumen de la migración
        if: always()
        run: |
          echo "## Resumen — Migraciones de Base de Datos (Producción)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Detalle | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Entorno | Producción (ekidb — Aiven) |" >> $GITHUB_STEP_SUMMARY
          echo "| Disparado por | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| Resultado | ${{ job.status == 'success' && 'Migración aplicada y verificada exitosamente' || 'Migración falló — revisar logs' }} |" >> $GITHUB_STEP_SUMMARY

      # ── Limpiar Deployments Antiguos ───────────────────────────────────────
      # Igual que jobs-scheduler: cada push a main crea un deployment en ekiEnvironment.
      # Mantenemos solo el activo más reciente borrando los anteriores inactivos.
      - name: Limpiar historial de deployments
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Borrando deployments inactivos del entorno ekiEnvironment..."
          DEPLOYMENTS=$(gh api -H "Accept: application/vnd.github+json" "/repos/${{ github.repository }}/deployments?environment=ekiEnvironment&per_page=20")
          echo "$DEPLOYMENTS" | jq -c '.[]' | while read -r dep; do
            ID=$(echo "$dep" | jq -r '.id')
            echo "Intentando borrar deployment ID: $ID..."
            gh api --method DELETE -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/deployments/$ID > /dev/null 2>&1 || true
          done
          echo "Limpieza completada."
