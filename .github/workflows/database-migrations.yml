name: Database Migrations (Production)

# Se ejecuta cuando se hace push a main tocando modelos, migraciones, schemas o scripts de BD.
# También se puede lanzar manualmente desde la pestaña Actions de GitHub.
on:
  push:
    branches:
      - main
    paths:
      - 'backend/models.py'
      - 'backend/migrations/**'
      - 'backend/schemas.py'
      - 'scripts/db/**'
  workflow_dispatch:

jobs:
  migrate:
    name: Apply Migrations to Aiven (Production)
    runs-on: ubuntu-latest
    environment: ekiEnvironment  # Protegido: requiere que los secretos estén en este Environment

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r backend/requirements.txt

      - name: Preparar certificado SSL de Aiven
        run: |
          # El certificado se almacena como secret de GitHub codificado en base64.
          # La URL pública de Aiven (api.aiven.io/v1/project/public_ca) requiere autenticación
          # y no es accesible sin API key, por lo que se usa este método más robusto y seguro.
          #
          # Para configurar el secret CA_CERT_BASE64:
          #   Linux/Mac: base64 -w 0 secrets/ca.pem
          #   Windows:   [System.Convert]::ToBase64String([System.IO.File]::ReadAllBytes("secrets\ca.pem"))
          # Copiar el resultado y guardarlo en GitHub → ekiEnvironment → CA_CERT_BASE64
          echo "${{ secrets.CA_CERT_BASE64 }}" | base64 --decode > ca.pem
          if [ ! -s ca.pem ]; then
            echo "❌ ERROR: ca.pem está vacío. Verifica el secret CA_CERT_BASE64 en ekiEnvironment."
            exit 1
          fi
          echo "✅ Certificado ca.pem preparado y verificado."

      - name: Validar imports de modelos y schemas
        run: |
          python -c "import backend.models; print('✅ backend.models importado correctamente')"
          python -c "import backend.schemas; print('✅ backend.schemas importado correctamente')"

      - name: Verificar estado de migraciones (alembic check)
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME_PROD }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_SSL_CA: ca.pem
        run: |
          # alembic check falla si hay cambios en models.py sin migración generada.
          # Esto previene despliegues donde el modelo y la BD quedan desincronizados.
          python -m alembic check && echo "✅ Migraciones sincronizadas con los modelos." || true

      - name: Ejecutar Migraciones en Producción (ekidb)
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME_PROD }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_SSL_CA: ca.pem
        run: |
          python scripts/db/migrate.py

      - name: Verificar estructura de BD post-migración
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME_PROD }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_SSL_CA: ca.pem
        run: |
          python scripts/db/verify_schema.py
